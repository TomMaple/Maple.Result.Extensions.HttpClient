# Creates a draft GitHub Release for the current main commit, with notes generated by git-cliff (cliff.toml).
# Review and edit the notes in the GitHub UI, then publish the release: that creates the tag and triggers "Publish".
# No tag is created here, so discarding the draft leaves nothing behind.
#
# Two jobs:
#   - "build" (read-only token) resolves the version, builds, tests and generates the notes;
#   - "draft" (write token) only creates the release.
# git-cliff and the NuGet packages never run next to the write token.

name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 3.0.0 or 3.0.0-rc.1. Leave empty to calculate it from the commits."
        required: false
        default: ""

concurrency:
  group: draft-release
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      consumer_facing: ${{ steps.notes.outputs.consumer_facing }}
    steps:
    - name: Check branch
      if: github.ref != 'refs/heads/main'
      run: |
        echo "::error::Releases are drafted from main only (got ${GITHUB_REF})."
        exit 1

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Get bumped version
      id: git_cliff
      uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
      with:
        version: v2.14.2
        args: --bumped-version

    - name: Resolve version
      id: version
      run: |
        if [ -n "$INPUT_VERSION" ]; then
          VERSION="${INPUT_VERSION#v}"
        else
          VERSION=$(python3 -I .github/scripts/version.py next "$BUMPED")
        fi
        PREVIOUS=$(python3 -I .github/scripts/version.py validate "$VERSION")
        if [ -z "$PREVIOUS" ]; then
          echo "::error::No v* tag found. Create the baseline tag first."
          exit 1
        fi
        if [ -z "$(git rev-list "${PREVIOUS}..HEAD")" ]; then
          echo "::error::No commits since ${PREVIOUS}. Nothing to release."
          exit 1
        fi
        PRERELEASE=false
        [[ "$VERSION" == *-* ]] && PRERELEASE=true
        {
          echo "version=${VERSION}"
          echo "previous=${PREVIOUS}"
          echo "prerelease=${PRERELEASE}"
        } >> "$GITHUB_OUTPUT"
        echo "Version: ${VERSION} (previous: ${PREVIOUS}, pre-release: ${PRERELEASE})"
      env:
        INPUT_VERSION: ${{ inputs.version }}
        BUMPED: ${{ steps.git_cliff.outputs.content }}

    - name: Setup .NET 10
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Build
      run: dotnet build --no-restore --configuration Release "-p:Version=${VERSION}" "-p:InformationalVersion=${VERSION}+${GITHUB_SHA}"
      env:
        VERSION: ${{ steps.version.outputs.version }}

    - name: Test
      run: dotnet test --no-build --configuration Release

    # The notes go to the temporary folder of the runner, which exists (git-cliff does not create the folder of its
    # output). The runner context is available in the steps, not in the env of the job.
    - name: Generate release notes
      uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
      with:
        version: v2.14.2
        args: --unreleased --tag v${{ steps.version.outputs.version }} --strip all -o ${{ runner.temp }}/notes.md

    # cliff.toml already renders a fallback text when every commit is filtered out. This also covers
    # git-cliff omitting the release entirely.
    - name: Check release notes
      id: notes
      run: |
        if [ -z "$(tr -d '[:space:]' < "$NOTES")" ]; then
          printf '%s\n\n%s\n\n%s\n' \
            "No consumer-facing changes. Build and test dependency updates only." \
            "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...v${VERSION}" \
            "📦 NuGet: https://www.nuget.org/packages/Maple.Result.Extensions.HttpClient/${VERSION}" > "$NOTES"
        fi
        if grep -q '^### ' "$NOTES"; then
          echo "consumer_facing=true" >> "$GITHUB_OUTPUT"
        else
          echo "consumer_facing=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No consumer-facing changes since ${PREVIOUS}. The draft is created anyway; consider discarding it."
        fi
        cat "$NOTES"
      env:
        NOTES: ${{ runner.temp }}/notes.md
        VERSION: ${{ steps.version.outputs.version }}
        PREVIOUS: ${{ steps.version.outputs.previous }}

    - name: Upload release notes
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-notes
        path: ${{ runner.temp }}/notes.md
        retention-days: 1
        if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      NOTES_PATH: ${{ github.workspace }}/notes
    steps:
    - name: Download release notes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-notes
        path: ${{ env.NOTES_PATH }}

    - name: Create draft release
      id: release
      run: |
        TAG="v${VERSION}"
        if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::A published release ${TAG} already exists."
            exit 1
          fi
          echo "Deleting the existing draft ${TAG}."
          gh release delete "$TAG" --yes
        fi
        ARGS=(--draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "${NOTES_PATH}/notes.md")
        [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)
        URL=$(gh release create "$TAG" "${ARGS[@]}")
        echo "url=${URL}" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ needs.build.outputs.version }}
        PRERELEASE: ${{ needs.build.outputs.prerelease }}

    - name: Summary
      run: |
        {
          echo "## Draft release v${VERSION}"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Version | \`${VERSION}\`$([ "$PRERELEASE" = "true" ] && echo ' (pre-release)') |"
          echo "| Previous tag | \`${PREVIOUS}\` |"
          echo "| Target | [\`${GITHUB_SHA::7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
          echo "| Draft | ${URL} |"
          echo
          if [ "$CONSUMER_FACING" != "true" ]; then
            echo "> [!WARNING]"
            echo "> No consumer-facing changes since ${PREVIOUS}. A release is usually not worth cutting; discard the draft unless you need it."
            echo
          fi
          echo "Review and edit the notes, then **Publish release** to create the tag and push the package to NuGet."
        } >> "$GITHUB_STEP_SUMMARY"
      env:
        VERSION: ${{ needs.build.outputs.version }}
        PREVIOUS: ${{ needs.build.outputs.previous }}
        PRERELEASE: ${{ needs.build.outputs.prerelease }}
        CONSUMER_FACING: ${{ needs.build.outputs.consumer_facing }}
        URL: ${{ steps.release.outputs.url }}

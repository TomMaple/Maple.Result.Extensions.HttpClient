# OpenSSF Scorecard: checks the repository against supply-chain security practices (pinned dependencies, branch
# protection, token permissions, signed releases, …). Results go to code scanning and to the public Scorecard API
# behind the README badge. Based on GitHub's starter workflow.
# publish_results restricts what the job may contain (no workflow-level env or defaults, only approved actions, no
# write permissions at the top): keep it to these steps. https://github.com/ossf/scorecard-action#workflow-restrictions

name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  push:
    branches: [ "main" ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write   # upload the results to code scanning
      id-token: write          # publish the results to the Scorecard API
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run analysis
      uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: true

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: scorecard-sarif
        path: results.sarif
        retention-days: 5

    - name: Upload to code scanning
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: results.sarif

# Lints the GitHub Actions workflows and the Dependabot configuration on pull requests that change them:
# actionlint (syntax, expressions, shellcheck of run: scripts) and zizmor (security: pinning, template injection,
# credential persistence, permissions). Not a required check, so the "paths" filter is fine here.

name: Workflow lint

on:
  pull_request:
    branches: [ "main" ]
    paths: [ ".github/**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8   # linux_amd64.tar.gz
  ZIZMOR_VERSION: 1.32.0

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install actionlint
      run: |
        ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
        echo "${ACTIONLINT_SHA256}  ${ARCHIVE}" | sha256sum --check
        tar -xzf "$ARCHIVE" actionlint

    - name: Run actionlint
      run: ./actionlint -color

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # advanced-security: false prints the findings and fails the job instead of uploading them to code scanning.
    - name: Run zizmor
      uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        version: ${{ env.ZIZMOR_VERSION }}
        advanced-security: false
        min-severity: low
